name: lint
on:
  push:
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning bin/fd-standby bin/fd-standby-swap lib/*.sh standby/standby-init.sh install.sh
      - name: bash syntax
        run: for f in bin/* lib/*.sh standby/standby-init.sh install.sh; do bash -n "$f"; done
      - name: python helpers compile
        run: python3 -m py_compile tools/render-qualified.py
      - name: candidates file format
        run: |
          awk '!/^[[:space:]]*(#|$)/ { if ($1 !~ /^(cherry|vultr)$/ || ($4 != "yes" && $4 != "no" && $4 != "off")) { print "bad line " NR ": " $0; bad=1 } } END { exit bad }' config/candidates.conf
