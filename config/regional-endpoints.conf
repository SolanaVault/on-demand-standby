# Regional endpoints the standby may re-point to the region closest to ITSELF.
#
#   provider  role  region  host  [alias]
#
# How it is used (standby/localize-endpoints.py):
#  - The standby runs exactly the primary's setup: only endpoints the primary uses are touched, and
#    nothing is added. No BAM on the primary -> no BAM on the standby; same for Jito, Harmonic, ...
#  - A value (Agave flag value or Firedancer TOML string) whose host is listed here gets the same
#    role's host of the chosen region. Scheme, port and path stay as on the primary.
#  - The region is chosen PER PROVIDER on the standby: lowest ping RTT over the region's hosts, among
#    the regions that have every role the primary uses. So a provider's endpoints always stay in
#    one region (Harmonic requires that). If no region answers, the primary's values are kept.
#  - Region "global": known, never changed (the provider routes it itself).
#  - "alias": a second name for the same endpoint. It is recognised but never written.
#  - Hosts under a listed domain that are NOT in this table are kept as they are, with a warning
#    from `ods doctor` and `ods bundle`.
# Add rows for other providers or new regions here (PRs welcome); `#` starts a comment.

# --- Jito block engine + shred receiver. Source: https://docs.jito.wtf/lowlatencytxnsend/#api (2026-11-24)
jito block-engine   global     mainnet.block-engine.jito.wtf
jito shred-receiver global     shredstream.mainnet.block-engine.jito.wtf
jito block-engine   amsterdam  amsterdam.mainnet.block-engine.jito.wtf
jito shred-receiver amsterdam  74.118.140.240
jito block-engine   dublin     dublin.mainnet.block-engine.jito.wtf
jito shred-receiver dublin     64.130.61.8
jito block-engine   frankfurt  frankfurt.mainnet.block-engine.jito.wtf
jito shred-receiver frankfurt  64.130.50.14
jito block-engine   london     london.mainnet.block-engine.jito.wtf
jito shred-receiver london     64.130.46.153
jito block-engine   ny         ny.mainnet.block-engine.jito.wtf
jito shred-receiver ny         141.98.216.96
jito block-engine   slc        slc.mainnet.block-engine.jito.wtf
jito shred-receiver slc        64.130.53.8
jito block-engine   singapore  singapore.mainnet.block-engine.jito.wtf
jito shred-receiver singapore  202.8.11.224
jito block-engine   tokyo      tokyo.mainnet.block-engine.jito.wtf
jito shred-receiver tokyo      202.8.9.160

# --- Jito BAM. Source: https://bam.dev/validators/ (2026-11-24). The long names (singapore.…) also
# resolve to the same nodes (checked in DNS 2026-11-24) and are accepted as aliases.
bam url global    mainnet.bam.jito.wtf
bam url ams       ams.mainnet.bam.jito.wtf
bam url ams       amsterdam.mainnet.bam.jito.wtf  alias
bam url iad       iad.mainnet.bam.jito.wtf
bam url dfw       dfw.mainnet.bam.jito.wtf
bam url dub       dub.mainnet.bam.jito.wtf
bam url dub       dublin.mainnet.bam.jito.wtf     alias
bam url fra       fra.mainnet.bam.jito.wtf
bam url fra       frankfurt.mainnet.bam.jito.wtf  alias
bam url hkg       hkg.mainnet.bam.jito.wtf
bam url lon       lon.mainnet.bam.jito.wtf
bam url lon       london.mainnet.bam.jito.wtf     alias
bam url lax       lax.mainnet.bam.jito.wtf
bam url ewr       ewr.mainnet.bam.jito.wtf
bam url ewr       ny.mainnet.bam.jito.wtf         alias
bam url pit       pit.mainnet.bam.jito.wtf
bam url slc       slc.mainnet.bam.jito.wtf
bam url sea       sea.mainnet.bam.jito.wtf
