# fd-standby candidate server types.
#   provider  plan  region  qualified  [# evidence]
# qualified: yes = proven by `fd-standby qualify` (or a real maintenance run): delivered, set up,
#                  caught up, swap rehearsal OK, cold restart timed, deleted. See README "Qualified servers".
#            no  = eligible on paper (>=48 threads, >=256 GB RAM, NVMe) but NOT tested yet.
#            off = never used.
# Requirements are checked on every delivered box before anything is changed (standby-init.sh
# --check-only); an unsuitable box is deleted and the next candidate is tried.
#
# Want to add a type? Run `fd-standby qualify PROVIDER PLAN REGION` and open a PR with the line from
# /var/lib/fd-standby/qualifications.log (see CONTRIBUTING.md).

